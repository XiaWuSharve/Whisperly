syntax = "proto3";

package message;

option go_package = "datas/";
option java_package = "com.github.xiawusharve.webrtc";
// 不支持描述符、嵌套构建器
option optimize_for = LITE_RUNTIME;

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  CONNECT                  = 1 [deprecated = true];
  DEPRECATED_CHAT          = 2 [deprecated = true];
  DEPRECATED_CANDIDATE     = 3 [deprecated = true];
  FETCH                    = 4 [deprecated = true];
  ACK                      = 5;
  NORMAL                   = 6;
  PULL                     = 7;
}

enum NormalType {
  NORMAL_TYPE_UNSPECIFIED = 0;
  CHAT                    = 1;
  HELLO                   = 2;
  CALL                    = 3;
  ANSWER                  = 4;
  CANDIDATE               = 5;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  SENDING                = 4;
  SENT                   = 5;
  FAIL                   = 3;
}

message Message {
  MessageType type         = 1;
  string      sender_id    = 2;
  string      receiver_id  = 3;
  int64       created_time = 4;
  int64       conn_id      = 12;
  int64       message_id   = 15;
  NormalType  type2_v2     = 5;
  oneof type2 {
    NormalType normal     = 13 [deprecated = true];
    AckStatus  ack_status = 14 [deprecated = true];
  } // enabled when type = normal or ack
  oneof data {
    Ack       ack       = 6;
    Candidate candidate = 7;
    Chat      chat      = 8;
    Sdp       call      = 9;
    Sdp       answer    = 10;
    Pull      pull      = 11;
  }
}

message Pull {
  int64 ack_sequence = 1;
  int32 pull_count   = 2;
}

message Sdp {
  string sdp = 2;
}

// 已有的消息与枚举
message Connect {
  option deprecated = true;
  string display_name = 1;
}

message Ack {
  AckStatus status     = 1;
  string    reason     = 3;
  string    message_id = 2 [deprecated = true];
}

message Candidate {
  string sdp_mid         = 2;
  int32  sdp_mline_index = 3;
  string sdp             = 4;
}

// 从 ChatMessage 迁移
message Chat {
  string               display_name  = 2;
  repeated MessageUnit message_chain = 3;
}

// 从 Go 的 MessageUnitType 常量迁移来的枚举
enum MessageUnitType {
  MESSAGE_UNIT_TYPE_UNSPECIFIED = 0;  // proto3 要求第一个值为 0
  TEXT                          = 1;
  CALL_UNIT                     = 2;
  ANSWER_UNIT                   = 3;
  ESTABLISH                     = 4;
}

// 从 MessageUnit 迁移
message MessageUnit {
  MessageUnitType type    = 1;
  string          message = 2;
}